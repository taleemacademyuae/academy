<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 أكاديمية تعليم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

:root {
  --bg: #f7f5f0;
  --bg2: #edeae3;
  --card: #ffffff;
  --border: #d8d3c8;
  --border2: #c8c2b5;
  --text: #1a1714;
  --text2: #6b6560;
  --text3: #9e9890;
  --green: #2d6a4f;
  --green-bg: #d8f3dc;
  --amber: #b5620a;
  --amber-bg: #fde8c8;
  --red: #9b2335;
  --red-bg: #fce4e8;
  --blue: #1d4e89;
  --blue-bg: #dbeafe;
  --accent: #2d6a4f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  direction: rtl;
}

.header {
  background: var(--text);
  color: white;
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.header-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.sync-badge {
  font-size: 11px; padding: 4px 12px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.7);
  display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,.1);
}
.sync-badge.ok  { color: #86efac; border-color: #86efac; }
.sync-badge.err { color: #fca5a5; border-color: #fca5a5; }

.nav {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  padding: 0 1rem;
}
.nav-btn {
  padding: 12px 20px; font-size: 13px; font-weight: 600;
  font-family: 'Tajawal', sans-serif;
  border: none; background: none; cursor: pointer;
  color: var(--text2); border-bottom: 2px solid transparent;
  white-space: nowrap; transition: all .15s;
}
.nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.nav-btn:hover:not(.active) { color: var(--text); background: var(--bg); }

.container { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem; }

.section { display: none; }
.section.active { display: block; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
}

.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 1rem; }
.g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: .875rem; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }

.metric {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem; text-align: center;
}
.metric-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
.metric-val { font-size: 26px; font-weight: 800; color: var(--text); }
.metric-val.ok   { color: var(--green); }
.metric-val.warn { color: var(--amber); }
.metric-val.bad  { color: var(--red); }

label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; font-weight: 600; }
input, select {
  width: 100%; font-size: 13px; font-family: 'Tajawal', sans-serif;
  direction: rtl; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
  outline: none; transition: border .15s;
}
input:focus, select:focus { border-color: var(--accent); }
.field { margin-bottom: 10px; }
.row { display: flex; flex-direction: row-reverse; gap: 10px; align-items: flex-start; }
.row .field { flex: 1; }

.btn {
  padding: 8px 16px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card);
  cursor: pointer; font-size: 13px; font-weight: 600;
  font-family: 'Tajawal', sans-serif; color: var(--text);
  transition: all .15s;
}
.btn:hover { background: var(--bg2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-p { background: var(--text); color: white; border-color: var(--text); }
.btn-p:hover { background: #333; }
.btn-d { color: var(--red); border-color: var(--red-bg); }
.btn-d:hover { background: var(--red-bg); }
.btn-renew { color: var(--blue); border-color: var(--blue-bg); }
.btn-renew:hover { background: var(--blue-bg); }
.btn-sm { padding: 4px 10px; font-size: 11px; }

.badge {
  display: inline-block; font-size: 11px; padding: 2px 9px;
  border-radius: 999px; font-weight: 700;
}
.b-ok   { background: var(--green-bg); color: var(--green); }
.b-warn { background: var(--amber-bg); color: var(--amber); }
.b-bad  { background: var(--red-bg);   color: var(--red);   }
.b-info { background: var(--blue-bg);  color: var(--blue);  }

table { width: 100%; border-collapse: collapse; font-size: 13px; direction: rtl; }
th {
  text-align: right; padding: 8px 10px; font-weight: 700;
  color: var(--text2); border-bottom: 1px solid var(--border);
  font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
  background: var(--bg); white-space: nowrap;
}
td {
  padding: 9px 10px; border-bottom: 1px solid var(--border);
  color: var(--text); vertical-align: middle; text-align: right;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg); }

.bar-wrap { height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }

.empty { text-align: center; color: var(--text3); padding: 2rem; font-size: 13px; }

.pill-row { display: flex; flex-direction: row-reverse; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.pill {
  padding: 5px 14px; border-radius: 999px;
  border: 1px solid var(--border); font-size: 12px; font-weight: 600;
  cursor: pointer; background: var(--card); color: var(--text2);
  font-family: 'Tajawal', sans-serif; transition: all .15s;
}
.pill.active { background: var(--text); color: white; border-color: var(--text); }

.ini {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; flex-shrink: 0;
}
.tc0 { background: #dbeafe; color: #1e40af; }
.tc1 { background: #d8f3dc; color: #1b4332; }
.tc2 { background: #fde8c8; color: #7c3400; }
.tc3 { background: #fce4e8; color: #881337; }
.tc4 { background: #ede9fe; color: #4c1d95; }

.session-dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; direction: ltr; }
.dot {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; position: relative; cursor: default;
}
.dot-ok    { background: var(--green-bg); color: var(--green); }
.dot-abs   { background: var(--red-bg);   color: var(--red);   }
.dot-empty { background: var(--bg2); border: 1.5px dashed var(--border2); }
.dot:hover .tip { display: block; }
.tip {
  display: none; position: absolute; bottom: 28px; left: 50%;
  transform: translateX(-50%); background: var(--text); color: white;
  border-radius: 6px; padding: 3px 8px; white-space: nowrap;
  font-size: 10px; z-index: 10;
}

.sec-title { font-size: 16px; font-weight: 800; margin-bottom: 1rem; }
.header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-direction: row-reverse; }
.header-row .sec-title { margin: 0; flex: 1; }

.renew-form {
  background: var(--blue-bg); border-radius: 10px;
  padding: 12px; margin-top: 12px;
  border: 1px solid #bfdbfe;
}

.sub-tag {
  display: inline-block; background: var(--blue-bg); color: var(--blue);
  border-radius: 999px; padding: 1px 7px; font-size: 10px; font-weight: 700; margin-right: 4px;
}

.spinner {
  display: inline-block; width: 10px; height: 10px;
  border: 2px solid currentColor; border-top-color: transparent;
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-overlay { text-align: center; padding: 3rem; color: var(--text2); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: white; border-radius: 10px;
  padding: 10px 20px; font-size: 13px; font-weight: 600;
  z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  display: none; white-space: nowrap; font-family: 'Tajawal', sans-serif;
}

.form-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
}
.form-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; }

@media (max-width: 600px) {
  .g4 { grid-template-columns: repeat(2,1fr); }
  .g2 { grid-template-columns: 1fr; }
  .row { flex-direction: column; }
}

/* شاشة تسجيل الدخول */
#loginScreen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; direction: rtl;
}
.login-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 2rem; width: 100%; max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,.08); margin: 1rem;
}
.login-logo { text-align: center; font-size: 48px; margin-bottom: 8px; }
.login-title { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.login-sub { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }
.role-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
.role-btn {
  padding: 12px; border-radius: 10px; border: 2px solid var(--border);
  background: var(--bg); cursor: pointer; text-align: center;
  font-family: 'Tajawal', sans-serif; transition: all .15s;
}
.role-btn:hover { border-color: var(--accent); background: var(--green-bg); }
.role-btn.selected { border-color: var(--accent); background: var(--green-bg); }
.role-btn .role-icon { font-size: 24px; display: block; margin-bottom: 4px; }
.role-btn .role-label { font-size: 13px; font-weight: 700; color: var(--text); }
.pin-input {
  display: flex; gap: 8px; justify-content: center; margin: 1rem 0;
  direction: ltr;
}
.pin-digit {
  width: 48px; height: 52px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--bg);
  text-align: center; font-size: 20px; font-weight: 800;
  font-family: 'Tajawal', sans-serif; color: var(--text);
  outline: none; transition: border .15s;
}
.pin-digit:focus { border-color: var(--accent); }
.login-err { color: var(--red); font-size: 12px; text-align: center; margin-top: 8px; display: none; }
.user-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.15); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; font-weight: 600; color: white;
}
.logout-btn {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
  color: white; border-radius: 6px; padding: 3px 8px; font-size: 11px;
  cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 600;
}
.logout-btn:hover { background: rgba(255,255,255,.2); }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">📚</div>
    <p class="login-title">أكاديمية تعليم</p>
    <p class="login-sub">اختر نوع الدخول</p>

    <div class="role-btns">
      <button class="role-btn" id="roleAdmin" onclick="selectRole('admin')">
        <span class="role-icon">👑</span>
        <span class="role-label">مدير</span>
      </button>
      <button class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">
        <span class="role-icon">🏫</span>
        <span class="role-label">معلم</span>
      </button>
    </div>

    <!-- اختيار المعلم محذوف — التعرف يتم بالرمز تلقائياً -->

    <div id="pinSection" style="display:none;">
      <p style="text-align:center;font-size:13px;color:var(--text2);margin-bottom:4px;" id="pinLabel">أدخل الرمز السري (4 أرقام)</p>
      <div class="pin-input">
        <input class="pin-digit" id="p0" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(0)" onkeydown="pinBack(event,0)">
        <input class="pin-digit" id="p1" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(1)" onkeydown="pinBack(event,1)">
        <input class="pin-digit" id="p2" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(2)" onkeydown="pinBack(event,2)">
        <input class="pin-digit" id="p3" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(3)" onkeydown="pinBack(event,3)">
      </div>
      <p class="login-err" id="loginErr">❌ الرمز السري غير صحيح</p>
      <button class="btn btn-p" style="width:100%;margin-top:8px;padding:12px;font-size:14px;" onclick="doLogin()">دخول ←</button>
    </div>
  </div>
</div>

<div id="mainApp" style="display:none;">
<div class="header">
  <div class="header-title">📚 أكاديمية تعليم</div>
  <div class="header-right">
    <div id="userChip" class="user-chip"></div>
    <button class="btn btn-sm" onclick="loadAll(true)" style="background:rgba(255,255,255,.1);color:white;border-color:rgba(255,255,255,.2);">🔄 تحديث</button>
    <button class="logout-btn" onclick="doLogout()">خروج</button>
    <div class="sync-badge" id="syncBadge"><span class="spinner"></span> جاري...</div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="goTab('overview',this)">📊 نظرة عامة</button>
  <button class="nav-btn" onclick="goTab('students',this)">👥 الطلاب</button>
  <button class="nav-btn" onclick="goTab('teachers',this)">🏫 المعلمون</button>
  <button class="nav-btn" onclick="goTab('log',this)">📅 تسجيل حصة</button>
</div>

<div class="container">

  <!-- نظرة عامة -->
  <div class="section active" id="sec-overview">
    <div id="ovContent">
      <div class="loading-overlay">
        <span class="spinner" style="width:28px;height:28px;border-width:3px;"></span>
        <p style="margin-top:14px;font-weight:600;">جاري تحميل البيانات من Google Sheets...</p>
      </div>
    </div>
  </div>

  <!-- الطلاب -->
  <div class="section" id="sec-students">
    <div class="header-row">
      <p class="sec-title">الطلاب</p>
      <button class="btn btn-p" onclick="toggleForm('addStu')">+ إضافة طالب</button>
    </div>
    <div class="form-card" id="addStu" style="display:none;">
      <p class="form-title">➕ طالب جديد</p>
      <div class="row">
        <div class="field"><label>الاسم الكامل</label><input id="sName" placeholder="مثال: يوسف الراشد"></div>
        <div class="field"><label>المعلم المسؤول</label><select id="sTch"></select></div>
      </div>
      <div class="row">
        <div class="field"><label>عدد الحصص في الحزمة</label><input type="number" id="sPack" value="10" min="1"></div>
        <div class="field"><label>رقم الاشتراك</label><input id="sSubN" placeholder="QA-2026-001"></div>
      </div>
      <div class="row">
        <div class="field"><label>السورة / المستوى (اختياري)</label><input id="sLevel" placeholder="مثال: البقرة، مبتدئ"></div>
        <div class="field"><label>موعد الحصة (اختياري)</label><input id="sDay" placeholder="مثال: السبت 4م"></div>
      </div>
      <div class="row">
        <div class="field"><label>تاريخ بدء الاشتراك</label><input type="date" id="sStartDate"></div>
        <div class="field"><label>الحصص المأخوذة مسبقاً (إن وجد)</label><input type="number" id="sPrevSessions" value="0" min="0" placeholder="0"></div>
      </div>
      <div style="display:flex;justify-content:flex-start;gap:8px;margin-top:6px;">
        <button class="btn btn-p" id="saveStuBtn" onclick="addStudent()">حفظ الطالب</button>
        <button class="btn" onclick="toggleForm('addStu')">إلغاء</button>
      </div>
    </div>
    <div class="pill-row" id="tchFilter"></div>
    <div id="stuCards"><div class="loading-overlay"><span class="spinner" style="width:22px;height:22px;border-width:3px;"></span></div></div>
  </div>

  <!-- المعلمون -->
  <div class="section" id="sec-teachers">
    <div class="header-row">
      <p class="sec-title">المعلمون</p>
      <button class="btn btn-p" onclick="toggleForm('addTch')">+ إضافة معلم</button>
    </div>
    <div class="form-card" id="addTch" style="display:none;">
      <p class="form-title">➕ معلم جديد</p>
      <div class="row">
        <div class="field"><label>الاسم الكامل</label><input id="tName" placeholder="مثال: الشيخ عمر"></div>
        <div class="field"><label>التخصص</label><input id="tSpec" placeholder="مثال: تجويد، حفظ"></div>
      </div>
      <div style="display:flex;justify-content:flex-start;gap:8px;">
        <button class="btn btn-p" id="saveTchBtn" onclick="addTeacher()">حفظ المعلم</button>
        <button class="btn" onclick="toggleForm('addTch')">إلغاء</button>
      </div>
    </div>
    <div id="tchCards"><div class="loading-overlay"><span class="spinner" style="width:22px;height:22px;border-width:3px;"></span></div></div>
  </div>

  <!-- تسجيل حصة -->
  <div class="section" id="sec-log">
    <div class="card">
      <p class="sec-title">تسجيل حصة</p>
      <div class="row">
        <div class="field" id="logTchField"><label>المعلم</label><select id="logTch" onchange="filterLogStu()"></select></div>
        <div class="field"><label>الطالب</label><select id="logStu"></select></div>
      </div>
      <div class="row">
        <div class="field"><label>التاريخ</label><input type="date" id="logDate"></div>
        <div class="field"><label>الحضور</label>
          <select id="logAtt">
            <option value="attended">✓ حضر</option>
            <option value="absent">✗ غاب</option>
          </select>
        </div>
      </div>
      <div class="field"><label>محتوى الحصة (اختياري)</label><input id="logContent" placeholder="مثال: مراجعة سورة الملك، تعليم أحكام النون الساكنة..."></div>
      <div style="display:flex;justify-content:flex-start;">
        <button class="btn btn-p" id="logBtn" onclick="logSession()">حفظ الحصة ↗</button>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">سجل الحصص</p>
      <div class="row" style="margin-bottom:12px;">
        <div class="field"><label>المعلم</label><select id="hTch" onchange="renderHistory()"><option value="">الكل</option></select></div>
        <div class="field"><label>الطالب</label><select id="hStu" onchange="renderHistory()"><option value="">الكل</option></select></div>
      </div>
      <div id="histTbl"></div>
    </div>
  </div>

</div>
</div><!-- end mainApp -->
<div class="toast" id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzhbi6Y2f4RWmBN_T7NE9NyhWrZbUsBHFaEOP19zKVw5M1HWDO5xtna3Hz2VvO8ufZYbQ/exec";
let D = {teachers:[], students:[], sessions:[]};
let cbCount = 0;

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cbName='__gs_cb_'+(cbCount++);
    const timer=setTimeout(()=>{ delete window[cbName]; document.getElementById(cbName)?.remove(); reject(new Error('timeout')); },15000);
    window[cbName]=data=>{ clearTimeout(timer); delete window[cbName]; document.getElementById(cbName)?.remove(); data.error?reject(new Error(data.error)):resolve(data); };
    const url=new URL(API);
    url.searchParams.set('callback',cbName);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,typeof v==='object'?JSON.stringify(v):String(v)));
    const s=document.createElement('script');
    s.id=cbName; s.src=url.toString();
    s.onerror=()=>{ clearTimeout(timer); delete window[cbName]; reject(new Error('script error')); };
    document.head.appendChild(s);
  });
}

// ===== إعدادات الدخول =====
const ADMIN_PIN = "1234"; // 👈 غيّر هذا الرمز السري للمدير
let currentRole = null;  // 'admin' أو 'teacher'
let currentTeacher = null; // كائن المعلم الحالي

// ===== تسجيل الدخول =====
let selectedRole = null;

function selectRole(role) {
  selectedRole = role;
  document.getElementById('roleAdmin').classList.toggle('selected', role==='admin');
  document.getElementById('roleTeacher').classList.toggle('selected', role==='teacher');
  document.getElementById('pinSection').style.display = 'block';
  document.getElementById('loginErr').style.display = 'none';
  const label = document.getElementById('pinLabel');
  label.textContent = role==='admin' ? 'أدخل رمز المدير (4 أرقام)' : 'أدخل رمزك السري (4 أرقام)';
  clearPin();
}

function populateTeacherSelect() {
  const sel = document.getElementById('loginTeacherName');
  sel.innerHTML = D.teachers.length
    ? D.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')
    : '<option value="">جاري التحميل...</option>';
}

function clearPin() {
  [0,1,2,3].forEach(i => { const el=document.getElementById('p'+i); if(el) el.value=''; });
  setTimeout(()=>document.getElementById('p0')?.focus(), 100);
}

function pinNext(i) {
  const el = document.getElementById('p'+i);
  if(el.value.length===1 && i<3) document.getElementById('p'+(i+1)).focus();
  if(i===3 && el.value.length===1) doLogin();
}

function pinBack(e, i) {
  if(e.key==='Backspace' && !document.getElementById('p'+i).value && i>0)
    document.getElementById('p'+(i-1)).focus();
}

function getPin() {
  return [0,1,2,3].map(i=>document.getElementById('p'+i).value).join('');
}

function doLogin() {
  const pin = getPin();
  const errEl = document.getElementById('loginErr');
  if(pin.length < 4) { errEl.style.display='block'; errEl.textContent='أدخل 4 أرقام'; return; }

  if(selectedRole === 'admin') {
    if(pin === ADMIN_PIN) {
      currentRole = 'admin'; currentTeacher = null;
      startApp();
    } else {
      errEl.style.display='block'; errEl.textContent='❌ الرمز السري غير صحيح';
      clearPin();
    }
  } else if(selectedRole === 'teacher') {
    // البحث عن المعلم بالرمز السري تلقائياً
    const t = D.teachers.find(t => t.pin === pin);
    if(t) {
      currentRole = 'teacher'; currentTeacher = t;
      startApp();
    } else {
      errEl.style.display='block'; errEl.textContent='❌ الرمز السري غير صحيح';
      clearPin();
    }
  }
}

function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  const chip = document.getElementById('userChip');
  chip.innerHTML = currentRole==='admin'
    ? '👑 مدير'
    : `🏫 ${currentTeacher.name}`;
  // إخفاء تبويب المعلمين للمعلم العادي
  const teacherTab = document.querySelectorAll('.nav-btn')[2];
  teacherTab.style.display = currentRole==='admin' ? '' : 'none';
  loadAll();
}

function doLogout() {
  currentRole = null; currentTeacher = null; selectedRole = null;
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pinSection').style.display = 'none';
  document.getElementById('roleAdmin').classList.remove('selected');
  document.getElementById('roleTeacher').classList.remove('selected');
  clearPin();
  goTab('overview', document.querySelectorAll('.nav-btn')[0]);
}

// فلترة البيانات حسب الدور
function visibleStudents() {
  if(currentRole==='admin') return D.students;
  if(!currentTeacher) return [];
  return D.students.filter(s=>s.tid===currentTeacher.id||s.tid===currentTeacher.name);
}
function visibleSessions() {
  if(currentRole==='admin') return D.sessions;
  if(!currentTeacher) return [];
  const myIds = visibleStudents().map(s=>s.id);
  return D.sessions.filter(s=>myIds.includes(s.sid));
}
// =========================

const uid = () => 'id'+Date.now()+Math.random().toString(36).slice(2,5);
const tch = id => D.teachers.find(t=>t.id===id) || D.teachers.find(t=>t.name===id) || {name:id||'—'};
const stu = id => D.students.find(s=>s.id===id)||{name:'—'};
const stuSess = sid => D.sessions.filter(s=>s.sid===sid);
const attended = sid => stuSess(sid).filter(s=>s.att==='attended').length;
const tcIdx = tid => { let i=D.teachers.findIndex(t=>t.id===tid); if(i<0) i=D.teachers.findIndex(t=>t.name===tid); return Math.max(0,i)%5; };
const ini = n => n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('');
const tryParse = v => { try{ const r=JSON.parse(v); return Array.isArray(r)?r:[]; }catch{ return []; } };

function toast(msg,dur=3000){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',dur);
}
function setSyncBadge(state){
  const el=document.getElementById('syncBadge');
  if(state==='ok')       {el.className='sync-badge ok';  el.innerHTML='✓ متصل بـ Google Sheets';}
  else if(state==='err') {el.className='sync-badge err'; el.innerHTML='✗ خطأ في الاتصال';}
  else                   {el.className='sync-badge';     el.innerHTML='<span class="spinner"></span> جاري...';}
}


async function loadAll(showToast=false){
  setSyncBadge('loading');
  try{
    const data=await jsonp({action:'getAll'});
    D.teachers=data.teachers||[]; D.students=data.students||[]; D.sessions=data.sessions||[];
    setSyncBadge('ok');
    if(document.getElementById('mainApp').style.display!=='none') renderCurrentTab();
    // تحديث قائمة المعلمين في شاشة الدخول
    if(document.getElementById('loginScreen').style.display!=='none') populateTeacherSelect();
    if(showToast) toast('✓ تم تحديث البيانات');
  }catch(e){
    setSyncBadge('err');
    document.getElementById('ovContent').innerHTML=`
      <div class="card" style="text-align:center;padding:2rem;">
        <p style="font-size:22px;margin-bottom:8px;">⚠️</p>
        <p style="font-size:15px;font-weight:700;margin-bottom:8px;color:var(--red)">تعذّر الاتصال بـ Google Sheets</p>
        <p style="font-size:12px;color:var(--text2);margin-bottom:16px;">تأكد أن إعداد النشر: Who has access = <strong>Anyone</strong></p>
        <button class="btn btn-p" onclick="loadAll(true)">🔄 إعادة المحاولة</button>
      </div>`;
  }
}

function renderCurrentTab(){
  const id=document.querySelector('.section.active')?.id?.replace('sec-','');
  if(id==='overview') renderOverview();
  else if(id==='students'){renderFilter();renderCards();}
  else if(id==='teachers') renderTeachers();
  else if(id==='log'){initLog();renderHistory();}
}

function status(sid){
  const s=stu(sid); const rem=s.pack-attended(sid);
  if(rem<=0) return{cls:'b-bad',valcls:'bad',label:'انتهت الحزمة'};
  if(rem<=2) return{cls:'b-warn',valcls:'warn',label:`متبقي ${rem}`};
  return{cls:'b-ok',valcls:'ok',label:`متبقي ${rem}`};
}

function goTab(name,btn){
  document.querySelectorAll('.nav-btn').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sec-'+name).classList.add('active');
  renderCurrentTab();
}

function toggleForm(id){

function initLog(){
  // إخفاء خانة المعلم للمعلم العادي
  const tField=document.getElementById('logTchField');
  if(currentRole==='teacher') tField.style.display='none';
  else tField.style.display='block';

  document.getElementById('logTch').innerHTML=D.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  if(currentRole==='teacher'&&currentTeacher) {
    document.getElementById('logTch').value=currentTeacher.id;
    document.getElementById('logTch').disabled=true;
  } else {
    document.getElementById('logTch').disabled=false;
  }
  filterLogStu();
  if(!document.getElementById('logDate').value) document.getElementById('logDate').value=new Date().toISOString().split('T')[0];
  // فلترة قائمة المعلمين في السجل حسب الدور
  document.getElementById('hTch').innerHTML='<option value="">الكل</option>'+(currentRole==='teacher'&&currentTeacher
    ? `<option value="${currentTeacher.id}">${currentTeacher.name}</option>`
    : D.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join(''));
  document.getElementById('hStu').innerHTML='<option value="">الكل</option>'+visibleStudents().map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}
function filterLogStu(){
  const tid=document.getElementById('logTch').value;
  const el=document.getElementById('logStu');
  const base=visibleStudents();
  const list=base.filter(s=>!tid||s.tid===tid);
  el.innerHTML=list.length?list.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''):'<option>لا يوجد طلاب</option>';
}
function renderHistory(){
  const fT=document.getElementById('hTch').value, fS=document.getElementById('hStu').value;
  let list=[...visibleSessions()].sort((a,b)=>b.date.localeCompare(a.date));
  if(fT) list=list.filter(s=>s.tid===fT);
  if(fS) list=list.filter(s=>s.sid===fS);
  document.getElementById('histTbl').innerHTML=list.length
    ?`<div style="overflow-x:auto;"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>المعلم</th><th>الحضور</th><th>محتوى الحصة</th><th></th></tr></thead>
      <tbody>${list.map(s=>`<tr><td style="font-weight:700">${s.date}</td><td>${stu(s.sid).name}</td><td>${tch(s.tid).name}</td>
        <td><span class="badge ${s.att==='attended'?'b-ok':'b-bad'}">${s.att==='attended'?'✓ حضر':'✗ غاب'}</span></td>
        <td style="color:var(--text2);font-size:12px">${s.content||'—'}</td>
        <td><button class="btn btn-sm btn-d" onclick="delSess('${s.id}')">🗑</button></td></tr>`).join('')}
      </tbody></table></div>`
    :'<p class="empty">لا توجد حصص</p>';
}

async function addStudent(){
  const name=document.getElementById('sName').value.trim();
  if(!name){toast('⚠️ أدخل اسم الطالب');return;}
  const pack=parseInt(document.getElementById('sPack').value)||10;
  const subN=document.getElementById('sSubN').value.trim();
  const startDate=document.getElementById('sStartDate').value||new Date().toISOString().split('T')[0];
  const prevSessions=parseInt(document.getElementById('sPrevSessions').value)||0;
  const btn=document.getElementById('saveStuBtn');
  btn.disabled=true; btn.textContent='جاري الحفظ...';
  const id=uid();
  const subs=JSON.stringify([{subN,pack,startDate}]);
  try{
    await jsonp({action:'addStudent',id,name,tid:document.getElementById('sTch').value,pack,subN,
      level:document.getElementById('sLevel').value.trim(),day:document.getElementById('sDay').value.trim(),subs});
    // إضافة الحصص السابقة دفعة واحدة إن وجدت
    if(prevSessions>0){
      for(let i=0;i<prevSessions;i++){
        await jsonp({action:'addSession',id:uid(),sid:id,tid:document.getElementById('sTch').value,date:startDate,att:'attended',content:'حصة سابقة'});
      }
    }
    ['sName','sSubN','sLevel','sDay'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('sPrevSessions').value='0';
    toggleForm('addStu'); toast('✓ تم إضافة الطالب'); await loadAll();
  }catch(e){toast('✗ حدث خطأ: '+e.message);}
  btn.disabled=false; btn.textContent='حفظ الطالب';
}
async function delStudent(id){
  if(!confirm('هل تريد حذف الطالب وجميع حصصه؟')) return;
  try{await jsonp({action:'deleteStudent',id});toast('✓ تم الحذف');await loadAll();}catch(e){toast('✗ حدث خطأ');}
}
async function addTeacher(){
  const name=document.getElementById('tName').value.trim();
  if(!name){toast('⚠️ أدخل اسم المعلم');return;}
  const btn=document.getElementById('saveTchBtn');
  btn.disabled=true; btn.textContent='جاري الحفظ...';
  try{
    await jsonp({action:'addTeacher',id:uid(),name,spec:document.getElementById('tSpec').value.trim()});
    ['tName','tSpec'].forEach(i=>document.getElementById(i).value='');
    toggleForm('addTch'); toast('✓ تم إضافة المعلم'); await loadAll();
  }catch(e){toast('✗ حدث خطأ');}
  btn.disabled=false; btn.textContent='حفظ المعلم';
}
async function delTeacher(id){
  if(!confirm('هل تريد حذف هذا المعلم؟')) return;
  try{await jsonp({action:'deleteTeacher',id});toast('✓ تم الحذف');await loadAll();}catch(e){toast('✗ حدث خطأ');}
}
async function logSession(){
  const tid=document.getElementById('logTch').value, sid=document.getElementById('logStu').value;
  const date=document.getElementById('logDate').value, att=document.getElementById('logAtt').value;
  const content=document.getElementById('logContent').value.trim();
  if(!sid||!date){toast('⚠️ اختر طالبًا وتاريخًا');return;}
  if(!tid){toast('⚠️ لا يوجد معلم محدد');return;}
  const btn=document.getElementById('logBtn');
  btn.disabled=true; btn.textContent='جاري الحفظ...';
  try{
    const res=await jsonp({action:'addSession',id:uid(),sid,tid,date,att,content});
    document.getElementById('logContent').value='';
    toast('✓ تم حفظ الحصة'); await loadAll(); renderHistory();
  }catch(e){
    toast('✗ خطأ: '+e.message, 6000);
    console.error('logSession error:',e);
  }
  btn.disabled=false; btn.textContent='حفظ الحصة ↗';
}
async function delSess(id){
  if(!confirm('حذف هذه الحصة؟')) return;
  try{await jsonp({action:'deleteSession',id});toast('✓ تم الحذف');await loadAll();renderHistory();}catch(e){toast('✗ حدث خطأ');}
}
function showRenew(sid){
  document.querySelectorAll('.renew-form').forEach(el=>el.style.display='none');
  const el=document.getElementById('renew-'+sid);
  if(el) el.style.display=el.style.display==='none'?'block':'none';
}
async function doRenew(sid){
  const newPack=parseInt(document.getElementById('rnPack-'+sid).value);
  const newSubN=document.getElementById('rnSubN-'+sid).value.trim();
  if(!newPack||newPack<1){toast('⚠️ أدخل عدد الحصص');return;}
  const s=stu(sid), totalPack=attended(sid)+newPack, subs=tryParse(s.subs);
  subs.push({subN:newSubN,pack:newPack,startDate:new Date().toISOString().split('T')[0]});
  const btn=document.getElementById('rnBtn-'+sid);
  if(btn){btn.disabled=true;btn.textContent='جاري...';}
  try{
    await jsonp({action:'updateStudent',id:sid,pack:totalPack,subN:newSubN||s.subN,subs:JSON.stringify(subs)});
    toast('✓ تم تجديد الاشتراك'); await loadAll();
  }catch(e){toast('✗ حدث خطأ في التجديد');}
  if(btn){btn.disabled=false;btn.textContent='✓ تأكيد التجديد';}
}
function quickLog(sid){
  const s=stu(sid);
  goTab('log',document.querySelectorAll('.nav-btn')[3]);
  setTimeout(()=>{ document.getElementById('logTch').value=s.tid; filterLogStu(); document.getElementById('logStu').value=sid; },100);
}

function showPinEdit(tid){
  document.querySelectorAll('[id^="pinEdit-"]').forEach(el=>el.style.display='none');
  const el=document.getElementById('pinEdit-'+tid);
  if(el) el.style.display=el.style.display==='none'?'block':'none';
}
async function savePin(tid){
  const pin=document.getElementById('pinVal-'+tid).value.trim();
  if(pin.length!==4||isNaN(pin)){toast('⚠️ الرمز يجب أن يكون 4 أرقام');return;}
  try{
    await jsonp({action:'updateTeacherPin',id:tid,pin});
    toast('✓ تم حفظ الرمز السري');
    await loadAll();
  }catch(e){toast('✗ حدث خطأ');}
}
