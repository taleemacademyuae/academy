<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية تعليم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f7f5f0;
  --bg2: #ffffff;
  --bg3: #f0ede8;
  --card: #ffffff;
  --border: #e0dbd2;
  --border2: #cdc8be;
  --text: #1a1714;
  --text2: #6b6560;
  --text3: #9e9890;
  --green: #1e6b3c;
  --green-bg: #d4eddf;
  --amber: #92580a;
  --amber-bg: #fdefd4;
  --red: #9b2335;
  --red-bg: #fce4e8;
  --blue: #1d4e89;
  --blue-bg: #dbeafe;
  --accent: #8b6914;
  --accent2: #b8890a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
.login-wrap{width:100%;max-width:400px;}
.login-logo{text-align:center;margin-bottom:2rem;}
.login-logo-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;}
.login-logo h1{font-size:24px;font-weight:800;color:var(--text);}
.login-logo p{font-size:13px;color:var(--text2);margin-top:4px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem;}
.role-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:1.25rem;text-align:center;cursor:pointer;transition:all .2s;}
.role-card:hover{border-color:var(--accent);background:var(--bg3);}
.role-card.selected{border-color:var(--accent);background:rgba(200,169,110,.1);}
.role-icon{font-size:28px;margin-bottom:8px;display:block;}
.role-label{font-size:14px;font-weight:700;color:var(--text);}
.pin-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem;}
.pin-label{font-size:13px;color:var(--text2);text-align:center;margin-bottom:1rem;}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:1.25rem;direction:ltr;}
.pin-dot{width:52px;height:56px;background:var(--bg3);border:1.5px solid var(--border2);border-radius:10px;text-align:center;font-size:22px;font-weight:800;color:var(--text);outline:none;transition:border .15s;font-family:'Tajawal',sans-serif;}
.pin-dot:focus{border-color:var(--accent);}
.pin-err{color:var(--red);font-size:12px;text-align:center;margin-bottom:10px;display:none;}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:800;border:none;border-radius:10px;cursor:pointer;font-family:'Tajawal',sans-serif;transition:opacity .15s;}
.btn-login:hover{opacity:.9;}

/* MAIN APP */
#mainApp{display:none;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:.875rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-logo{display:flex;align-items:center;gap:10px;}
.header-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.header-title{font-size:16px;font-weight:800;color:var(--text);}
.header-right{display:flex;align-items:center;gap:8px;}
.user-chip{background:var(--bg3);border:1px solid var(--border2);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--accent);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}
.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* NAV */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 1rem;}
.nav-btn{padding:12px 18px;font-size:13px;font-weight:600;font-family:'Tajawal',sans-serif;border:none;background:none;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.nav-btn:hover:not(.active){color:var(--text);}

/* LAYOUT */
.container{max-width:960px;margin:0 auto;padding:1.25rem 1rem;}
.section{display:none;}.section.active{display:block;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1rem;}
.form-card{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}

/* GRID */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:.875rem;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
@media(max-width:600px){.g4{grid-template-columns:repeat(2,1fr);}.g2{grid-template-columns:1fr;}.row{flex-direction:column;}}

/* METRICS */
.metric{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
.metric-val{font-size:26px;font-weight:800;}
.metric-val.ok{color:var(--green);}
.metric-val.warn{color:var(--amber);}
.metric-val.bad{color:var(--red);}
.metric-val.accent{color:var(--accent);}

/* FORM */
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:600;}
input,select,textarea{width:100%;font-size:13px;font-family:'Tajawal',sans-serif;direction:rtl;padding:9px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:9px;color:var(--text);outline:none;transition:border .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--bg);}
.field{margin-bottom:10px;}
.row{display:flex;flex-direction:row-reverse;gap:10px;align-items:flex-start;}.row .field{flex:1;}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;font-size:13px;font-weight:600;font-family:'Tajawal',sans-serif;color:var(--text);transition:all .15s;}
.btn:hover{background:var(--border);}.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;}
.btn-p:hover{opacity:.9;}
.btn-d{color:var(--red);border-color:rgba(248,113,113,.3);}
.btn-d:hover{background:var(--red-bg);}
.btn-info{color:var(--blue);border-color:rgba(96,165,250,.3);}
.btn-info:hover{background:var(--blue-bg);}
.btn-sm{padding:4px 10px;font-size:11px;}

/* BADGES */
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;}
.b-ok{background:var(--green-bg);color:var(--green);}
.b-warn{background:var(--amber-bg);color:var(--amber);}
.b-bad{background:var(--red-bg);color:var(--red);}
.b-info{background:var(--blue-bg);color:var(--blue);}
.b-accent{background:rgba(200,169,110,.15);color:var(--accent);}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:right;padding:9px 10px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;text-align:right;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}

/* PROGRESS */
.bar-wrap{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:60px;}
.bar-fill{height:100%;border-radius:3px;transition:width .4s;}

/* DOTS */
.session-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;direction:ltr;}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;position:relative;cursor:default;}
.dot-ok{background:var(--green-bg);color:var(--green);}
.dot-abs{background:var(--red-bg);color:var(--red);}
.dot-empty{background:var(--bg3);border:1.5px dashed var(--border2);}
.dot:hover .tip{display:block;}
.tip{display:none;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:7px;padding:4px 8px;white-space:nowrap;font-size:10px;z-index:10;color:var(--text);}

/* MISC */
.sec-title{font-size:16px;font-weight:800;margin-bottom:1rem;color:var(--text);}
.header-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-direction:row-reverse;}
.header-row .sec-title{margin:0;flex:1;}
.empty{text-align:center;color:var(--text3);padding:2rem;font-size:13px;}
.pill-row{display:flex;flex-direction:row-reverse;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
.pill{padding:5px 14px;border-radius:999px;border:1px solid var(--border2);font-size:12px;font-weight:600;cursor:pointer;background:var(--bg3);color:var(--text2);font-family:'Tajawal',sans-serif;transition:all .15s;}
.pill.active{background:rgba(200,169,110,.15);border-color:var(--accent);color:var(--accent);}
.ini{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.tc0{background:rgba(96,165,250,.15);color:var(--blue);}
.tc1{background:rgba(74,222,128,.15);color:var(--green);}
.tc2{background:rgba(251,191,36,.15);color:var(--amber);}
.tc3{background:rgba(248,113,113,.15);color:var(--red);}
.tc4{background:rgba(200,169,110,.15);color:var(--accent);}
.renew-form{background:var(--blue-bg);border:1px solid rgba(96,165,250,.2);border-radius:10px;padding:12px;margin-top:12px;}
.sub-tag{display:inline-block;background:var(--blue-bg);color:var(--blue);border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700;margin-right:4px;}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-overlay{text-align:center;padding:3rem;color:var(--text2);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;white-space:nowrap;font-family:'Tajawal',sans-serif;color:var(--text);}
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="login-logo-icon">📚</div>
      <h1>أكاديمية تعليم</h1>
      <p>نظام متابعة الطلاب والحصص</p>
    </div>
    <div class="role-grid">
      <div class="role-card" id="roleAdmin" onclick="selectRole('admin')">
        <span class="role-icon">👑</span>
        <div class="role-label">مدير</div>
      </div>
      <div class="role-card" id="roleTeacher" onclick="selectRole('teacher')">
        <span class="role-icon">🏫</span>
        <div class="role-label">معلم</div>
      </div>
    </div>
    <div class="pin-section" id="pinSection" style="display:none;">
      <p class="pin-label" id="pinLabel">أدخل الرمز السري</p>
      <div class="pin-dots">
        <input class="pin-dot" id="p0" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(0)" onkeydown="pinBack(event,0)">
        <input class="pin-dot" id="p1" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(1)" onkeydown="pinBack(event,1)">
        <input class="pin-dot" id="p2" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(2)" onkeydown="pinBack(event,2)">
        <input class="pin-dot" id="p3" maxlength="1" type="password" inputmode="numeric" oninput="pinNext(3)" onkeydown="pinBack(event,3)">
      </div>
      <p class="pin-err" id="pinErr">❌ الرمز غير صحيح</p>
      <button class="btn-login" onclick="doLogin()">دخول ←</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <div class="header">
    <div class="header-logo">
      <div class="header-logo-icon">📚</div>
      <span class="header-title">أكاديمية تعليم</span>
    </div>
    <div class="header-right">
      <div class="sync-dot" id="syncDot"></div>
      <span class="user-chip" id="userChip"></span>
      <button class="btn btn-sm" onclick="loadAll(true)">🔄</button>
      <button class="btn btn-sm btn-d" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="goTab('overview',this)">📊 نظرة عامة</button>
    <button class="nav-btn" onclick="goTab('students',this)">👥 الطلاب</button>
    <button class="nav-btn" id="teachersTab" onclick="goTab('teachers',this)">🏫 المعلمون</button>
    <button class="nav-btn" onclick="goTab('log',this)">📅 تسجيل حصة</button>
  </div>

  <div class="container">

    <!-- OVERVIEW -->
    <div class="section active" id="sec-overview">
      <div id="ovContent"><div class="loading-overlay"><span class="spinner" style="width:28px;height:28px;border-width:3px;"></span><p style="margin-top:14px;">جاري التحميل...</p></div></div>
    </div>

    <!-- STUDENTS -->
    <div class="section" id="sec-students">
      <div class="header-row">
        <p class="sec-title">الطلاب</p>
        <button class="btn btn-p" onclick="toggleForm('addStu')">+ إضافة طالب</button>
      </div>
      <div class="form-card" id="addStu" style="display:none;">
        <p style="font-size:14px;font-weight:800;margin-bottom:12px;">➕ طالب جديد</p>
        <div class="row">
          <div class="field"><label>الاسم الكامل</label><input id="sName" placeholder="مثال: يوسف الراشد"></div>
          <div class="field"><label>المعلم المسؤول</label><select id="sTch"></select></div>
        </div>
        <div class="row">
          <div class="field"><label>عدد الحصص في الحزمة</label><input type="number" id="sPack" value="10" min="1"></div>
          <div class="field"><label>رقم الاشتراك</label><input id="sSubN" placeholder="QA-001"></div>
        </div>
        <div class="row">
          <div class="field"><label>السورة / المستوى</label><input id="sLevel" placeholder="مثال: جزء عم، مبتدئ"></div>
          <div class="field"><label>موعد الحصة</label><input id="sDay" placeholder="مثال: السبت 4م"></div>
        </div>
        <div class="row">
          <div class="field"><label>تاريخ بدء الاشتراك</label><input type="date" id="sStartDate"></div>
          <div class="field"><label>حصص مأخوذة مسبقاً</label><input type="number" id="sPrevSessions" value="0" min="0"></div>
        </div>
        <div style="display:flex;justify-content:flex-start;gap:8px;margin-top:4px;">
          <button class="btn btn-p" id="saveStuBtn" onclick="addStudent()">حفظ الطالب</button>
          <button class="btn" onclick="toggleForm('addStu')">إلغاء</button>
        </div>
      </div>
      <div class="pill-row" id="tchFilter"></div>
      <div id="stuCards"><div class="loading-overlay"><span class="spinner" style="width:22px;height:22px;border-width:3px;"></span></div></div>
    </div>

    <!-- TEACHERS -->
    <div class="section" id="sec-teachers">
      <div class="header-row">
        <p class="sec-title">المعلمون</p>
        <button class="btn btn-p" onclick="toggleForm('addTch')">+ إضافة معلم</button>
      </div>
      <div class="form-card" id="addTch" style="display:none;">
        <p style="font-size:14px;font-weight:800;margin-bottom:12px;">➕ معلم جديد</p>
        <div class="row">
          <div class="field"><label>الاسم الكامل</label><input id="tName" placeholder="مثال: الشيخ عمر"></div>
          <div class="field"><label>التخصص</label><input id="tSpec" placeholder="مثال: تجويد، حفظ"></div>
        </div>
        <div class="row">
          <div class="field"><label>رمز الدخول (4 أرقام)</label><input id="tPin" maxlength="4" placeholder="مثال: 1234" type="password"></div>
          <div class="field"><label>معرّف فريد (بالإنجليزي)</label><input id="tId" placeholder="مثال: omar أو heba"></div>
        </div>
        <div style="display:flex;justify-content:flex-start;gap:8px;">
          <button class="btn btn-p" id="saveTchBtn" onclick="addTeacher()">حفظ المعلم</button>
          <button class="btn" onclick="toggleForm('addTch')">إلغاء</button>
        </div>
      </div>
      <div id="tchCards"><div class="loading-overlay"><span class="spinner" style="width:22px;height:22px;border-width:3px;"></span></div></div>
    </div>

    <!-- LOG -->
    <div class="section" id="sec-log">
      <div class="card">
        <p class="sec-title">تسجيل حصة</p>
        <div class="row">
          <div class="field" id="logTchField"><label>المعلم</label><select id="logTch" onchange="filterLogStu()"></select></div>
          <div class="field"><label>الطالب</label><select id="logStu"></select></div>
        </div>
        <div class="row">
          <div class="field"><label>التاريخ</label><input type="date" id="logDate"></div>
          <div class="field"><label>الحضور</label>
            <select id="logAtt">
              <option value="attended">✓ حضر</option>
              <option value="absent">✗ غاب</option>
            </select>
          </div>
        </div>
        <div class="field"><label>محتوى الحصة (اختياري)</label><input id="logContent" placeholder="مثال: مراجعة سورة الملك، أحكام التجويد..."></div>
        <div style="display:flex;justify-content:flex-start;">
          <button class="btn btn-p" id="logBtn" onclick="logSession()">حفظ الحصة ↗</button>
        </div>
      </div>
      <div class="card">
        <p class="sec-title">سجل الحصص</p>
        <div class="row" style="margin-bottom:12px;">
          <div class="field"><label>المعلم</label><select id="hTch" onchange="renderHistory()"><option value="">الكل</option></select></div>
          <div class="field"><label>الطالب</label><select id="hStu" onchange="renderHistory()"><option value="">الكل</option></select></div>
        </div>
        <div id="histTbl"></div>
      </div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ========== SUPABASE ==========
const SUPABASE_URL = 'https://hflodiuvdbbopxdcegst.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmbG9kaXV2ZGJib3B4ZGNlZ3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4Mjg1MDMsImV4cCI6MjA5NDQwNDUwM30.7BbaFISSkEPlXznOitYyv5U7vdpd9WbLdXgT_xlJEcE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ========== STATE ==========
const ADMIN_PIN = '1234';
let D = {teachers:[], students:[], sessions:[]};
let currentRole = null;
let currentTeacher = null;
let selectedRole = null;

// ========== HELPERS ==========
const uid = () => 'id'+Date.now()+Math.random().toString(36).slice(2,5);
const tch = id => D.teachers.find(t=>t.id===id) || D.teachers.find(t=>t.name===id) || {name:'—'};
const stu = id => D.students.find(s=>s.id===id)||{name:'—'};
const stuSess = sid => D.sessions.filter(s=>s.sid===sid);
const attended = sid => stuSess(sid).filter(s=>s.att==='attended').length;
const tcIdx = tid => { let i=D.teachers.findIndex(t=>t.id===tid); if(i<0) i=D.teachers.findIndex(t=>t.name===tid); return Math.max(0,i)%5; };
const ini = n => n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('');
const tryParse = v => { try{ const r=JSON.parse(v); return Array.isArray(r)?r:[]; }catch{ return []; } };

function toast(msg, dur=3000){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',dur);
}
function setSyncDot(state){
  const el=document.getElementById('syncDot');
  el.className='sync-dot '+(state==='ok'?'ok':state==='err'?'err':'loading');
}

// ========== SUPABASE API ==========
async function dbGet(table, filter={}){
  let q = sb.from(table).select('*');
  Object.entries(filter).forEach(([k,v])=>q=q.eq(k,v));
  const {data,error} = await q;
  if(error) throw new Error(JSON.stringify(error));
  return data||[];
}
async function dbInsert(table, row){
  const {error} = await sb.from(table).insert(row);
  if(error) throw new Error(JSON.stringify(error));
}
async function dbUpdate(table, id, updates){
  const {error} = await sb.from(table).update(updates).eq('id',id);
  if(error) throw new Error(JSON.stringify(error));
}
async function dbDelete(table, id){
  const {error} = await sb.from(table).delete().eq('id',id);
  if(error) throw new Error(JSON.stringify(error));
}

// ========== LOAD DATA ==========
async function loadAll(showToast=false){
  setSyncDot('loading');
  try{
    const [teachers, students, sessions] = await Promise.all([
      dbGet('teachers'),
      dbGet('students'),
      dbGet('sessions')
    ]);
    D.teachers = teachers;
    D.students = students.map(s=>({...s, subs: tryParse(s.subs)}));
    D.sessions = sessions;
    setSyncDot('ok');
    renderCurrentTab();
    if(showToast) toast('✓ تم تحديث البيانات');
  }catch(e){
    setSyncDot('err');
    toast('✗ خطأ في الاتصال: '+e.message, 5000);
    console.error(e);
  }
}

// ========== LOGIN ==========
function selectRole(role){
  selectedRole=role;
  document.getElementById('roleAdmin').classList.toggle('selected',role==='admin');
  document.getElementById('roleTeacher').classList.toggle('selected',role==='teacher');
  document.getElementById('pinSection').style.display='block';
  document.getElementById('pinLabel').textContent=role==='admin'?'أدخل رمز المدير':'أدخل رمزك السري';
  document.getElementById('pinErr').style.display='none';
  clearPin();
}
function clearPin(){ [0,1,2,3].forEach(i=>{const el=document.getElementById('p'+i);if(el)el.value='';}); setTimeout(()=>document.getElementById('p0')?.focus(),100); }
function pinNext(i){ const el=document.getElementById('p'+i); if(el.value.length===1&&i<3)document.getElementById('p'+(i+1)).focus(); if(i===3&&el.value.length===1)doLogin(); }
function pinBack(e,i){ if(e.key==='Backspace'&&!document.getElementById('p'+i).value&&i>0)document.getElementById('p'+(i-1)).focus(); }
function getPin(){ return [0,1,2,3].map(i=>document.getElementById('p'+i).value).join(''); }

function doLogin(){
  const pin=getPin();
  const errEl=document.getElementById('pinErr');
  if(pin.length<4){errEl.style.display='block';errEl.textContent='أدخل 4 أرقام';return;}
  if(selectedRole==='admin'){
    if(pin===ADMIN_PIN){ currentRole='admin'; currentTeacher=null; startApp(); }
    else{ errEl.style.display='block'; errEl.textContent='❌ الرمز غير صحيح'; clearPin(); }
  } else {
    const t=D.teachers.find(t=>t.pin===pin);
    if(t){ currentRole='teacher'; currentTeacher=t; startApp(); }
    else{ errEl.style.display='block'; errEl.textContent='❌ الرمز غير صحيح'; clearPin(); }
  }
}

function startApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('userChip').textContent=currentRole==='admin'?'👑 مدير':'🏫 '+currentTeacher.name;
  document.getElementById('teachersTab').style.display=currentRole==='admin'?'':'none';
  loadAll();
}

function doLogout(){
  currentRole=null; currentTeacher=null; selectedRole=null;
  document.getElementById('mainApp').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('pinSection').style.display='none';
  document.getElementById('roleAdmin').classList.remove('selected');
  document.getElementById('roleTeacher').classList.remove('selected');
  clearPin();
  goTab('overview',document.querySelectorAll('.nav-btn')[0]);
}

// ========== FILTERED DATA ==========
function visibleStudents(){ return currentRole==='admin'?D.students:D.students.filter(s=>s.tid===currentTeacher?.id||s.tid===currentTeacher?.name); }
function visibleSessions(){ const ids=visibleStudents().map(s=>s.id); return currentRole==='admin'?D.sessions:D.sessions.filter(s=>ids.includes(s.sid)); }

// ========== STATUS ==========
function status(sid){
  const s=stu(sid); const rem=s.pack-attended(sid);
  if(rem<=0)return{cls:'b-bad',valcls:'bad',label:'انتهت الحزمة'};
  if(rem<=2)return{cls:'b-warn',valcls:'warn',label:'متبقي '+rem};
  return{cls:'b-ok',valcls:'ok',label:'متبقي '+rem};
}

// ========== TAB ROUTING ==========
function goTab(name,btn){
  document.querySelectorAll('.nav-btn').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sec-'+name).classList.add('active');
  renderCurrentTab();
}
function renderCurrentTab(){
  const id=document.querySelector('.section.active')?.id?.replace('sec-','');
  if(id==='overview')renderOverview();
  else if(id==='students'){renderFilter();renderCards();}
  else if(id==='teachers')renderTeachers();
  else if(id==='log'){initLog();renderHistory();}
}
function toggleForm(id){
  const el=document.getElementById(id);
  el.style.display=el.style.display==='none'?'block':'none';
  if(id==='addStu')document.getElementById('sTch').innerHTML=D.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  if(id==='addStu'&&!document.getElementById('sStartDate').value)document.getElementById('sStartDate').value=new Date().toISOString().split('T')[0];
}

  filterLogStu();
  if(!document.getElementById('logDate').value)document.getElementById('logDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('hTch').innerHTML='<option value="">الكل</option>'+(currentRole==='teacher'&&currentTeacher?`<option value="${currentTeacher.id}">${currentTeacher.name}</option>`:D.teachers.map(t=>`<option value="${t.id}">${t.name}</option>`).join(''));
  document.getElementById('hStu').innerHTML='<option value="">الكل</option>'+visibleStudents().map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}
function filterLogStu(){
  const tid=document.getElementById('logTch').value;
  const base=visibleStudents();
  const list=base.filter(s=>!tid||s.tid===tid);
  document.getElementById('logStu').innerHTML=list.length?list.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''):'<option>لا يوجد طلاب</option>';
}
function renderHistory(){
  const fT=document.getElementById('hTch').value,fS=document.getElementById('hStu').value;
  let list=[...visibleSessions()].sort((a,b)=>b.date.localeCompare(a.date));
  if(fT)list=list.filter(s=>s.tid===fT);
  if(fS)list=list.filter(s=>s.sid===fS);
  document.getElementById('histTbl').innerHTML=list.length
    ?`<div style="overflow-x:auto;"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>المعلم</th><th>الحضور</th><th>المحتوى</th><th></th></tr></thead>
      <tbody>${list.map(s=>`<tr><td style="font-weight:700">${s.date}</td><td>${stu(s.sid).name}</td><td>${tch(s.tid).name}</td>
        <td><span class="badge ${s.att==='attended'?'b-ok':'b-bad'}">${s.att==='attended'?'✓ حضر':'✗ غاب'}</span></td>
        <td style="color:var(--text2);font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.content||'—'}</td>
        <td>${currentRole==='admin'?`<button class="btn btn-sm btn-d" onclick="delSess('${s.id}')">🗑</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`
    :'<p class="empty">لا توجد حصص</p>';
}

// ========== CRUD ==========
async function addStudent(){
  const name=document.getElementById('sName').value.trim();
  if(!name){toast('⚠️ أدخل اسم الطالب');return;}
  const pack=parseInt(document.getElementById('sPack').value)||10;
  const subN=document.getElementById('sSubN').value.trim();
  const startDate=document.getElementById('sStartDate').value||new Date().toISOString().split('T')[0];
  const prevSessions=parseInt(document.getElementById('sPrevSessions').value)||0;
  const tid=document.getElementById('sTch').value;
  const btn=document.getElementById('saveStuBtn');
  btn.disabled=true;btn.textContent='جاري الحفظ...';
  const id=uid();
  const subs=JSON.stringify([{subN,pack,startDate}]);
  try{
    await dbInsert('students',{id,name,tid,pack,sub_n:subN,level:document.getElementById('sLevel').value.trim(),day:document.getElementById('sDay').value.trim(),subs,start_date:startDate});
    if(prevSessions>0){
      for(let i=0;i<prevSessions;i++){
        await dbInsert('sessions',{id:uid(),sid:id,tid,date:startDate,att:'attended',content:'حصة سابقة'});
      }
    }
    ['sName','sSubN','sLevel','sDay'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('sPrevSessions').value='0';
    toggleForm('addStu');toast('✓ تم إضافة الطالب');await loadAll();
  }catch(e){toast('✗ خطأ: '+e.message,5000);console.error(e);}
  btn.disabled=false;btn.textContent='حفظ الطالب';
}

async function delStudent(id){
  if(!confirm('هل تريد حذف الطالب وجميع حصصه؟'))return;
  try{
    await dbDelete('sessions_by_student',id); // cascade handles it
    await sb.from('sessions').delete().eq('sid',id);
    await dbDelete('students',id);
    toast('✓ تم الحذف');await loadAll();
  }catch(e){toast('✗ خطأ: '+e.message);}
}

async function addTeacher(){
  const name=document.getElementById('tName').value.trim();
  const tid=document.getElementById('tId').value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!name){toast('⚠️ أدخل اسم المعلم');return;}
  if(!tid){toast('⚠️ أدخل معرّف المعلم');return;}
  const pin=document.getElementById('tPin').value.trim();
  const btn=document.getElementById('saveTchBtn');
  btn.disabled=true;btn.textContent='جاري الحفظ...';
  try{
    await dbInsert('teachers',{id:tid,name,spec:document.getElementById('tSpec').value.trim(),pin});
    ['tName','tSpec','tPin','tId'].forEach(i=>document.getElementById(i).value='');
    toggleForm('addTch');toast('✓ تم إضافة المعلم');await loadAll();
  }catch(e){toast('✗ خطأ: '+e.message,5000);console.error(e);}
  btn.disabled=false;btn.textContent='حفظ المعلم';
}

async function delTeacher(id){
  if(!confirm('هل تريد حذف هذا المعلم؟'))return;
  try{await dbDelete('teachers',id);toast('✓ تم الحذف');await loadAll();}catch(e){toast('✗ خطأ: '+e.message);}
}

async function logSession(){
  const tid=document.getElementById('logTch').value,sid=document.getElementById('logStu').value;
  const date=document.getElementById('logDate').value,att=document.getElementById('logAtt').value;
  const content=document.getElementById('logContent').value.trim();
  if(!sid||!date){toast('⚠️ اختر طالبًا وتاريخًا');return;}
  const btn=document.getElementById('logBtn');
  btn.disabled=true;btn.textContent='جاري الحفظ...';
  try{
    await dbInsert('sessions',{id:uid(),sid,tid,date,att,content});
    document.getElementById('logContent').value='';
    toast('✓ تم حفظ الحصة');await loadAll();renderHistory();
  }catch(e){toast('✗ خطأ: '+e.message,5000);console.error(e);}
  btn.disabled=false;btn.textContent='حفظ الحصة ↗';
}

async function delSess(id){
  if(!confirm('حذف هذه الحصة؟'))return;
  try{await dbDelete('sessions',id);toast('✓ تم الحذف');await loadAll();renderHistory();}catch(e){toast('✗ خطأ');}
}

function showRenew(sid){
  document.querySelectorAll('.renew-form').forEach(el=>el.style.display='none');
  const el=document.getElementById('renew-'+sid);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

async function doRenew(sid){
  const newPack=parseInt(document.getElementById('rnPack-'+sid).value);
  const newSubN=document.getElementById('rnSubN-'+sid).value.trim();
  if(!newPack||newPack<1){toast('⚠️ أدخل عدد الحصص');return;}
  const s=stu(sid),totalPack=attended(sid)+newPack;
  const subs=Array.isArray(s.subs)?[...s.subs]:[];

  // توليد رقم اشتراك تلقائي إذا لم يُدخل
  let finalSubN = newSubN;
  if(!finalSubN){
    const current=s.sub_n||'1';
    const num=parseInt(current);
    finalSubN=isNaN(num)?current+'-2':(num+1).toString();
  }

  subs.push({subN:finalSubN,pack:newPack,startDate:new Date().toISOString().split('T')[0]});
  const btn=document.getElementById('rnBtn-'+sid);
  if(btn){btn.disabled=true;btn.textContent='جاري...';}
  try{
    await dbUpdate('students',sid,{pack:totalPack,sub_n:finalSubN,subs:JSON.stringify(subs)});
    toast('✓ تم تجديد الاشتراك — رقم الاشتراك الجديد: '+finalSubN);await loadAll();
  }catch(e){toast('✗ خطأ: '+e.message);}
  if(btn){btn.disabled=false;btn.textContent='✓ تأكيد';}
}

function showEditStu(sid){
  document.querySelectorAll('[id^="editStu-"]').forEach(el=>el.style.display='none');
  const el=document.getElementById('editStu-'+sid);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

    sub_n:document.getElementById('eStuSubN-'+sid).value.trim(),

  };
  try{
    await dbUpdate('students',sid,updates);
    toast('✓ تم حفظ التعديلات');await loadAll();
  }catch(e){toast('✗ خطأ: '+e.message);}
}

function showEditTch(tid){
  document.querySelectorAll('[id^="editTch-"]').forEach(el=>el.style.display='none');
  const el=document.getElementById('editTch-'+tid);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

  };

function showPinEdit(tid){
  document.querySelectorAll('[id^="pinEdit-"]').forEach(el=>el.style.display='none');
  const el=document.getElementById('pinEdit-'+tid);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

async function savePin(tid){
  const pin=document.getElementById('pinVal-'+tid).value.trim();
  if(pin.length!==4||isNaN(pin)){toast('⚠️ الرمز يجب أن يكون 4 أرقام');return;}
  try{await dbUpdate('teachers',tid,{pin});toast('✓ تم حفظ الرمز');await loadAll();}catch(e){toast('✗ خطأ');}
}

function quickLog(sid){
  const s=stu(sid);
  goTab('log',document.querySelectorAll('.nav-btn')[3]);
  setTimeout(()=>{document.getElementById('logTch').value=s.tid;filterLogStu();document.getElementById('logStu').value=sid;},100);
}
